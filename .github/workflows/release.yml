name: Verify and package dashboard

on:
    push:
        branches: [main]
    pull_request:
    release:
        types: [published]

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - name: Check release tag
              if: github.event_name == 'release'
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: node -e "const p = require('./package.json'); if (process.env.RELEASE_TAG !== 'v' + p.version) process.exit(1)"
            - run: npm run prepare:conformance
            - run: npx playwright install --with-deps chromium
            - run: npm test
            - run: npm run test:browser
            - run: npm run package:release
            - run: npm run test:release
            - uses: actions/upload-artifact@v4
              with:
                  name: dashboard-release
                  path: target/release/*
                  if-no-files-found: error
    publish:
        if: github.event_name == 'release'
        needs: verify
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: dashboard-release
                  path: release
            - name: Attach verified package
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: gh release upload "$RELEASE_TAG" release/* --clobber
